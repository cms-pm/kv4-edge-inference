# Copy to ansible/inventory.ini and point [gpu] at your GPU host.
# The playbooks target the `gpu` group and run nvidia-smi / llama.cpp there.
[gpu]
my-gpu-host ansible_host=192.0.2.10 ansible_user=youruser

# Notes:
# - The host needs: NVIDIA driver + CUDA, the llama-cpp-turboquant build, and the
#   GGUF models in {{ model_dir }}.
# - Some tasks use `become: true` (persistence mode, clock lock, ncu). Ensure the
#   user has sudo, or run the read-only/bench-only subset without privilege.
